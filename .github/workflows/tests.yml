name: Java 17 tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run JUnit tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Run demonstration
        run: ./run.sh 3
